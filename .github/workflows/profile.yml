name: Update profile images

# Generates the stats cards (scripts/stats.py) and the contribution snake, then
# publishes them to the `output` branch that README.md reads from.
on:
  schedule:
    - cron: "17 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/profile.yml"]
  pull_request: # dry run: build and test, but don't publish

permissions:
  contents: read

concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push to the output branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the stats generator
        run: python3 -m unittest discover -s tests -v

      - name: Generate stats cards
        env:
          # A STATS_TOKEN secret (classic token: repo + read:user) also counts private
          # repositories; without it, only public data is visible.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          STATS_DISPLAY_NAME: Zeiad Gamal
        run: python3 scripts/stats.py "${{ github.repository_owner }}" dist

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7c3aed
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a78bfa

      - name: Keep the images as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-images
          path: dist

      - name: Publish to the output branch
        if: github.event_name != 'pull_request'
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
